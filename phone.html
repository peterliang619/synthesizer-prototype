<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Synthesizer Controller</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        #status {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 1000;
        }
        #status.connected {
            background-color: rgba(34, 139, 34, 0.8);
        }
        #keys-container {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 8px;
            padding: 60px 10px 10px 10px;
            height: 100vh;
        }
        .key {
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            border: 2px solid #3a3a3a;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            user-select: none;
            transition: all 0.1s;
        }
        .key:active, .key.pressed {
            background: linear-gradient(145deg, #4a4a4a, #3a3a3a);
            transform: scale(0.95);
            border-color: #5a5a5a;
        }
        .key-label {
            font-size: 12px;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div id="status">Connecting...</div>
    <div id="keys-container"></div>

    <script>
        const statusEl = document.getElementById('status');
        const keysContainer = document.getElementById('keys-container');

        // WebSocket connection
        const ws = new WebSocket(`ws://${window.location.hostname}:${window.location.port}`);

        ws.onopen = () => {
            console.log('Connected to server');
            ws.send(JSON.stringify({ type: 'register', role: 'controller' }));
            statusEl.textContent = 'Connected ✓';
            statusEl.classList.add('connected');
        };

        ws.onerror = (error) => {
            console.error('WebSocket error:', error);
            statusEl.textContent = 'Connection Error';
            statusEl.classList.remove('connected');
        };

        ws.onclose = () => {
            console.log('Disconnected from server');
            statusEl.textContent = 'Disconnected';
            statusEl.classList.remove('connected');
        };

        // Create 40 keys
        for (let i = 1; i <= 40; i++) {
            const keyEl = document.createElement('div');
            keyEl.className = 'key';
            keyEl.innerHTML = `<span class="key-label">${i}</span>`;
            keyEl.dataset.keyId = `key${i}`;

            // Track active touches
            let isPressed = false;

            // Touch start
            keyEl.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (!isPressed) {
                    isPressed = true;
                    keyEl.classList.add('pressed');
                    ws.send(JSON.stringify({
                        type: 'keypress',
                        keyId: `key${i}`
                    }));
                }
            });

            // Touch end
            keyEl.addEventListener('touchend', (e) => {
                e.preventDefault();
                if (isPressed) {
                    isPressed = false;
                    keyEl.classList.remove('pressed');
                    ws.send(JSON.stringify({
                        type: 'keyrelease',
                        keyId: `key${i}`
                    }));
                }
            });

            // Touch cancel
            keyEl.addEventListener('touchcancel', (e) => {
                e.preventDefault();
                if (isPressed) {
                    isPressed = false;
                    keyEl.classList.remove('pressed');
                    ws.send(JSON.stringify({
                        type: 'keyrelease',
                        keyId: `key${i}`
                    }));
                }
            });

            // Mouse events (for testing on desktop)
            keyEl.addEventListener('mousedown', (e) => {
                e.preventDefault();
                if (!isPressed) {
                    isPressed = true;
                    keyEl.classList.add('pressed');
                    ws.send(JSON.stringify({
                        type: 'keypress',
                        keyId: `key${i}`
                    }));
                }
            });

            keyEl.addEventListener('mouseup', (e) => {
                e.preventDefault();
                if (isPressed) {
                    isPressed = false;
                    keyEl.classList.remove('pressed');
                    ws.send(JSON.stringify({
                        type: 'keyrelease',
                        keyId: `key${i}`
                    }));
                }
            });

            keyEl.addEventListener('mouseleave', (e) => {
                if (isPressed) {
                    isPressed = false;
                    keyEl.classList.remove('pressed');
                    ws.send(JSON.stringify({
                        type: 'keyrelease',
                        keyId: `key${i}`
                    }));
                }
            });

            keysContainer.appendChild(keyEl);
        }

        // Prevent page scrolling on touch
        document.body.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
