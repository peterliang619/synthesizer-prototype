<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synthesizer</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: white;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #svg-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
        }
        #svg-container svg {
            max-width: 90%;
            max-height: 90vh;
            width: auto;
            height: auto;
        }
        .key-pressed {
            opacity: 0.6;
            filter: brightness(1.2);
            transform: translateY(2px);
        }
        .key-interactive {
            transition: transform 0.1s, opacity 0.1s, filter 0.1s;
        }
    </style>
</head>
<body>
    <div id="svg-container"></div>

    <script>
        // Load the SVG file
        fetch('synthesizer svg')
            .then(response => response.text())
            .then(svgContent => {
                // Insert SVG into the container
                document.getElementById('svg-container').innerHTML = svgContent;

                // Wait a bit for SVG to be fully loaded in DOM
                setTimeout(() => {
                    // Add interactivity to keys 1-40
                    for (let i = 1; i <= 40; i++) {
                        const key = document.getElementById(`key${i}`);

                        if (key) {
                            // Make cursor pointer and add transition class
                            key.style.cursor = 'pointer';
                            key.classList.add('key-interactive');

                            // Mouse events
                            key.addEventListener('mousedown', () => {
                                key.classList.add('key-pressed');
                                console.log(`key${i} pressed`);
                            });

                            key.addEventListener('mouseup', () => {
                                key.classList.remove('key-pressed');
                            });

                            key.addEventListener('mouseleave', () => {
                                key.classList.remove('key-pressed');
                            });

                            // Touch events for mobile
                            key.addEventListener('touchstart', (e) => {
                                e.preventDefault();
                                key.classList.add('key-pressed');
                                console.log(`key${i} pressed`);
                            });

                            key.addEventListener('touchend', (e) => {
                                e.preventDefault();
                                key.classList.remove('key-pressed');
                            });
                        }
                    }

                    console.log('Synthesizer loaded with 40 pressable keys (key1-key40)');
                }, 100);
            })
            .catch(error => {
                console.error('Error loading SVG:', error);
                document.getElementById('svg-container').innerHTML =
                    '<p>Error loading synthesizer. Please make sure "synthesizer svg" file is in the same directory.</p>';
            });
    </script>
</body>
</html>
