<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synthesizer</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: white;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #svg-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100vh;
        }
        #svg-container svg {
            width: 140%;
            height: 140%;
            object-fit: contain;
            transform: translateX(10%);
        }
        .key-pressed {
            opacity: 0.6;
            filter: brightness(1.2);
            transform: translateY(2px);
        }
        .key-interactive {
            transition: transform 0.1s, opacity 0.1s, filter 0.1s;
        }
    </style>
</head>
<body>
    <div id="svg-container"></div>

    <script>
        // WebSocket connection
        const ws = new WebSocket(`ws://${window.location.hostname}:${window.location.port}`);

        ws.onopen = () => {
            console.log('Connected to server');
            ws.send(JSON.stringify({ type: 'register', role: 'display' }));
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'keypress') {
                const key = document.getElementById(data.keyId);
                if (key) {
                    key.classList.add('key-pressed');
                    console.log(`${data.keyId} pressed from controller`);
                }
            } else if (data.type === 'keyrelease') {
                const key = document.getElementById(data.keyId);
                if (key) {
                    key.classList.remove('key-pressed');
                }
            }
        };

        ws.onerror = (error) => {
            console.error('WebSocket error:', error);
        };

        ws.onclose = () => {
            console.log('Disconnected from server');
        };

        // Load the SVG file
        fetch('synthesizer svg')
            .then(response => response.text())
            .then(svgContent => {
                // Insert SVG into the container
                document.getElementById('svg-container').innerHTML = svgContent;

                // Wait a bit for SVG to be fully loaded in DOM
                setTimeout(() => {
                    // Add interactive class to keys 1-40
                    for (let i = 1; i <= 40; i++) {
                        const key = document.getElementById(`key${i}`);
                        if (key) {
                            key.classList.add('key-interactive');
                        }
                    }

                    console.log('Synthesizer display loaded - waiting for controller input');
                }, 100);
            })
            .catch(error => {
                console.error('Error loading SVG:', error);
                document.getElementById('svg-container').innerHTML =
                    '<p>Error loading synthesizer. Please make sure "synthesizer svg" file is in the same directory.</p>';
            });
    </script>
</body>
</html>
